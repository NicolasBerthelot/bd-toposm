<!DOCTYPE html>
<html lang="fr" data-fr-scheme="light">
  <head>
    <meta charset="utf-8">
    <title>BD France Édition</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgo=">
    <link rel="stylesheet" href="dsfr/dsfr.min.css">
    <link rel="stylesheet" href="iD.css">
    <link rel="stylesheet" href="bdfrance.css">
  </head>

  <body>
    <!-- En-tête DSFR, sans bloc-marque République française (réservé). -->
    <header role="banner" class="fr-header">
      <div class="fr-header__body">
        <div class="fr-container">
          <div class="fr-header__body-row">
            <div class="fr-header__brand fr-enlarge-link">
              <div class="fr-header__brand-top"></div>
              <div class="fr-header__service">
                <a href="./" title="Accueil — BD France Édition">
                  <p class="fr-header__service-title">BD France Édition</p>
                </a>
                <p class="fr-header__service-tagline">Instance de démonstration sur la ville de Poitiers</p>
              </div>
            </div>
            <div class="fr-header__tools">
              <div class="fr-header__tools-links">
                <ul class="fr-btns-group">
                  <li>
                    <a class="fr-btn fr-btn--tertiary" href="https://github.com/NicolasBerthelot/bd-toposm" target="_blank" rel="noopener">Code source</a>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
      <!-- Modules thématiques : chaque entrée ne montre que les couches BD TOPO
           de son thème (cf. modules.js). Le bouton Cadastre bascule la
           surcouche parcellaire de la Géoplateforme (cf. fonds.json). -->
      <div class="fr-header__menu bdf-modules" id="bdf-modules">
        <div class="fr-container bdf-modules__barre">
          <nav class="fr-nav" role="navigation" aria-label="Modules thématiques">
            <ul class="fr-nav__list"></ul>
          </nav>
          <p class="bdf-module-compte" hidden aria-live="polite"></p>
          <button type="button" class="fr-btn fr-btn--sm fr-btn--tertiary bdf-cadastre" aria-pressed="false" disabled
                  title="Afficher ou masquer le parcellaire cadastral (PCI Express, IGN) en surcouche">Cadastre</button>
        </div>
      </div>
    </header>

    <div id="id-container"></div>

    <footer class="bdf-footer" role="contentinfo">
      Données : <strong>IGN — BD France</strong>, <a href="https://www.etalab.gouv.fr/licence-ouverte-open-licence/" target="_blank" rel="noopener">Licence Ouverte 2.0</a>.
      Édition : <a href="https://github.com/openstreetmap/iD" target="_blank" rel="noopener">iD</a> (ISC).
      Les modifications sont enregistrées dans cette instance uniquement.
    </footer>

    <div id="bdtopo-error" hidden style="position:fixed;inset:0;z-index:2000;padding:32px;background:#fff;font:14px/1.6 Marianne,Arial,sans-serif"></div>

    <script src="modules.js"></script>
    <script>
      // Emplacement d'ouverture par défaut : centre de Poitiers, au zoom 17.
      // iD ne charge les données qu'à partir du zoom 16 ; ouvrir plus large
      // afficherait une carte vide et laisserait croire à une panne.
      var DEFAUT = '#map=17.00/46.58020/0.34040';
      if (!window.location.hash) {
        window.history.replaceState(null, '', window.location.pathname + window.location.search + DEFAUT);
      }

      var container = document.getElementById('id-container');
      // Documentation BD TOPO Explorer (référence des tags bdtopo:*) et table
      // des préfixes cleabs → couche, partagée avec les modules thématiques.
      var DOCS = fetch('bdtopo-docs.json', { cache: 'no-cache' }).then(function (r) { return r.json(); })
        .catch(function () { return null; });
      var script = document.createElement('script');
      script.src = 'iD.min.js';
      script.onload = demarrer;
      script.onerror = function () { echec('Le script <code>iD.min.js</code> n’a pas pu être chargé.'); };
      document.head.appendChild(script);

      function echec(message) {
        var box = document.getElementById('bdtopo-error');
        box.innerHTML = '<h2>BD France Édition n’a pas démarré</h2><p>' + message + '</p>';
        box.hidden = false;
      }

      function demarrer() {
        if (typeof iD === 'undefined' || !iD.utilDetect().support) {
          echec('Navigateur non pris en charge.');
          return;
        }

        var context = iD.coreContext()
          .assetPath('')
          .locale('fr')
          .containerNode(container);

        // Bascule vers cette instance AVANT init : sans cela iD interroge
        // openstreetmap.org, dont les identifiants OAuth ne valent pas ici.
        // `url` et `apiUrl` pointent la même origine — l'API et iD sont servis
        // par le même processus, ce qui évite toute question de CORS.
        var origine = window.location.origin;
        context.connection().switch({ url: origine, apiUrl: origine });

        context.init();

        brancherDocumentationBdTopo(context);

        DOCS.then(function (docs) {
          if (window.bdfModules) {
            bdfModules.init(context, docs && docs.prefixes, document.getElementById('bdf-modules'));
          }
        });

        window.bdtopoContext = context;  // utile au diagnostic depuis la console
      }

      // ------------------------------------------------------------------
      // Référence des tags bdtopo:* → BD TOPO Explorer.
      //
      // Le bouton ⓘ d'iD interroge le service `osmWikibase` pour obtenir un
      // objet { title, description, wiki: {url} }. On l'intercepte : pour un
      // tag issu de la BD Topo, la réponse vient de la documentation IGN
      // (attribut ou valeur, avec l'ancre exacte de la page BD TOPO Explorer) ;
      // pour tout autre tag, le service d'origine répond comme d'habitude.
      // La couche de l'objet se déduit du préfixe de son `ref:FR:IGN:cleabs`.
      var CHAMPS = { usage: 'usage_1', etat: 'etat_de_l_objet', voltage: 'voltage' };

      function brancherDocumentationBdTopo(context) {
        var service = iD.services && iD.services.osmWikibase;
        if (!service) return;
        var docs = null;
        DOCS.then(function (d) { docs = d; });

        var original = service.getDocs;
        service.getDocs = function (params, callback) {
          var key = params.key || '';
          var reponse = docs && (key.indexOf('bdtopo:') === 0 || key === 'ref:FR:IGN:cleabs')
            ? documentation(context, docs, key, params.value) : null;
          if (reponse) { callback(null, reponse); return; }

          // Clé OSM sur un objet issu de la BD Topo : on explique d'où elle
          // vient (règle, attributs lus, motif), puis on laisse la référence
          // OSM habituelle compléter — c'est la documentation du format.
          var self = this;
          explication(context, key).then(function (why) {
            if (!why) { original.call(self, params, callback); return; }
            original.call(self, params, function (err, osmDocs) {
              callback(null, fusionner(why, osmDocs, key, params.value));
            });
          });
        };
      }

      var EXPLICATIONS = {};  // cache par identifiant d'objet

      function explication(context, key) {
        var ids = context.selectedIDs();
        if (ids.length !== 1) return Promise.resolve(null);
        var entite = context.hasEntity(ids[0]);
        if (!entite || !entite.tags['ref:FR:IGN:cleabs']) return Promise.resolve(null);
        var osmId = entite.osmId();
        var cle = entite.type + '/' + osmId;
        if (!EXPLICATIONS[cle]) {
          EXPLICATIONS[cle] = fetch('api/bdfrance/explain/' + cle)
            .then(function (r) { return r.ok ? r.json() : null; })
            .catch(function () { return null; });
        }
        return EXPLICATIONS[cle].then(function (data) {
          return data && data.tags && data.tags[key] ? data.tags[key] : null;
        });
      }

      var MODES = {
        first_match: 'classification exclusive, première branche qui correspond',
        map: 'correspondance de valeurs',
        copy: 'valeur reprise de la BD Topo',
        literal: 'valeur fixe posée par la conversion',
        compute: 'arbitrage par fonction',
        set: 'règle'
      };

      function fusionner(why, osmDocs, key, value) {
        var texte = function (sel) {
          var bloc = sel.append('div').attr('class', 'bdf-why');
          bloc.append('strong').text('Déduit de la BD TOPO® : ');
          var champs = Object.keys(why.fields || {});
          if (champs.length) {
            bloc.append('span').text(champs.map(function (f) {
              var v = why.fields[f];
              return f + ' = ' + (v === null || v === undefined ? '(vide)' : '« ' + v + ' »');
            }).join(' ; '));
          } else {
            bloc.append('span').text('aucun attribut — ' + (MODES[why.mode] || why.mode));
          }
          if (why.condition) {
            bloc.append('div').text('Règle : ' + why.condition
              + (why.branch ? ' (branche ' + why.branch + ', ' + MODES.first_match + ')' : ''));
          } else if (why.mode && MODES[why.mode]) {
            bloc.append('div').text('Règle : ' + MODES[why.mode]);
          }
          if (why.motif) {
            bloc.append('div').attr('class', 'bdf-why-motif').text('Motif : ' + why.motif);
          }
          if (osmDocs && osmDocs.description) {
            sel.append('div').attr('class', 'bdf-why-osm').text('Référence OSM : ');
            sel.call(osmDocs.description);
          }
        };
        var base = osmDocs || {};
        return {
          title: base.title || (key + '=' + (value || why.value)),
          description: texte,
          descriptionLocaleCode: 'fr',
          editURL: base.editURL,
          imageURL: base.imageURL,
          wiki: base.wiki
        };
      }

      function coucheDe(context, docs) {
        var ids = context.selectedIDs();
        var entite = ids.length ? context.hasEntity(ids[0]) : null;
        var cleabs = entite && entite.tags['ref:FR:IGN:cleabs'];
        if (!cleabs) return null;
        var nom = docs.prefixes[cleabs.slice(0, 8)];
        return nom ? { nom: nom, doc: docs.couches[nom] } : null;
      }

      function texte(t) { return function (sel) { sel.text(t); }; }

      function documentation(context, docs, key, value) {
        var couche = coucheDe(context, docs);
        if (!couche || !couche.doc) return null;
        var c = couche.doc;

        if (key === 'ref:FR:IGN:cleabs') {
          return {
            title: 'BD TOPO® — ' + c.label + (c.theme ? ' (' + c.theme + ')' : ''),
            description: texte(c.definition || 'Identifiant pérenne de l’objet dans la couche « ' + c.label + ' » de la BD TOPO.'),
            descriptionLocaleCode: 'fr',
            editURL: c.url,
            wiki: { url: c.url, text: texte('Voir la couche dans BD TOPO Explorer') }
          };
        }

        var champ = key.slice('bdtopo:'.length);
        champ = CHAMPS[champ] || champ;
        var attr = c.attributes[champ];
        if (!attr) return null;

        var val = value && attr.values && attr.values[value];
        if (val) {
          return {
            title: attr.label + ' = « ' + value + ' »',
            description: texte(val.definition || attr.definition || ''),
            descriptionLocaleCode: 'fr',
            editURL: val.url,
            wiki: { url: val.url, text: texte('Voir cette valeur dans BD TOPO Explorer') }
          };
        }
        return {
          title: attr.label + ' (' + c.label + ')',
          description: texte(attr.definition || ''),
          descriptionLocaleCode: 'fr',
          editURL: attr.url,
          wiki: { url: attr.url, text: texte('Voir cet attribut dans BD TOPO Explorer') }
        };
      }
    </script>
  </body>
</html>
