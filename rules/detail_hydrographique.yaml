layer: detail_hydrographique
description: >-
  Points d'eau remarquables : sources, fontaines, lavoirs, citernes. Mesures sur
  le département 86, 2 906 points.

report_key: natural
point_mode: standalone

rules:
  - set:
      source: "IGN BD TOPO® 3.5"
      "ref:FR:IGN:cleabs": "{cleabs}"
      name: {from: toponyme}

  - first_match:
      - when: {nature: [Source, Source captée, Résurgence]}
        set: {natural: spring}
      - when: {nature: Fontaine}
        set: {amenity: fountain}
      - when: {nature: Lavoir}
        set: {amenity: washing_place, historic: wash_house}
      - when: {nature: Point d'eau, nature_detaillee: Puits}
        set: {man_made: water_well}
      # Citernes et points d'eau DFCI : réserves incendie, pas des puits.
      - when: {nature: Citerne}
        set: {emergency: water_tank}
      - when: {nature_detaillee: DFCI}
        set: {emergency: fire_water_pond}
      - when: {nature: Point d'eau}
        set: {natural: water, water: pond}
      - when: {nature: Cascade}
        set: {waterway: waterfall}
      - when: {nature: Marais}
        set: {natural: wetland, wetland: marsh}
      # « Perte » : point où un cours d'eau s'enfonce sous terre (karst).
      - when: {nature: Perte}
        set: {natural: sinkhole, sinkhole: ponor}
      - when: {}
        set:
          fixme: "Nature BD TOPO sans équivalent OSM établi — à qualifier"

  - set:
      intermittent: {from: persistance, map: {Intermittent: "yes"}}
      "bdtopo:nature": {from: nature}
      "bdtopo:nature_detaillee": {from: nature_detaillee}

unmapped:
  importance: Hiérarchie d'affichage cartographique, sans équivalent OSM.
  etat_de_l_objet: Non discriminant sur cette couche.
