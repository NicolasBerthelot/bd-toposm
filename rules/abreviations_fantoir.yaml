# Abréviations FANTOIR des types de voie, telles qu'on les trouve dans
# `nom_collaboratif_*` de la BD Topo (97,3 % des valeurs sont en majuscules
# abrégées). OSM demande des noms développés : « Rue du Haut des Sables »,
# pas « R DU HAUT DES SABLES ».
#
# Les clés sont comparées en majuscules sur le PREMIER mot du toponyme
# uniquement — « ALL » en tête est « Allée », mais au milieu d'un nom ce
# pourrait être autre chose. Un mot non listé est laissé intact : mieux vaut
# un type de voie non développé qu'une expansion fausse.
#
# Attention aux faux amis du Poitou : CHEZ, LA, LE, LES, GRAND sont des mots
# du toponyme, pas des abréviations — ils ne figurent donc pas ici.

types_de_voie:
  ALL: Allée
  ANSE: Anse
  AV: Avenue
  BD: Boulevard
  CAR: Carrefour
  CHE: Chemin
  CHEM: Chemin
  CHS: Chaussée
  CITE: Cité
  COR: Corniche
  COUR: Cour
  CRS: Cours
  DOM: Domaine
