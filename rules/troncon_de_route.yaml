layer: troncon_de_route
description: >-
  Réseau routier BD Topo 3.5 → OSM. La classification `highway` suit une matrice
  à deux étages : `cpx_classement_administratif` fait autorité quand il est
  renseigné (15,7 % des tronçons dans la Vienne), `nature × importance` sert de
  repli pour les 84,3 % restants. Mesures sur le département 86, 342 922 tronçons.

report_key: highway

drop:
  - when: {etat_de_l_objet: En projet}
    reason: >-
      Tracé non construit, sans existence physique sur le terrain (8 entités
      dans la Vienne). OSM proscrit `highway=proposed` en dehors de projets
      documentés et validés localement.

rules:

  # ---------------------------------------------------------------- provenance
  - set:
      source: "IGN BD TOPO® 3.5"
      "ref:FR:IGN:cleabs": "{cleabs}"

  # ------------------------------------------------- classification principale
  # Branches exclusives, évaluées dans l'ordre : la première qui correspond gagne.
  # L'ordre encode la priorité sémantique — un aménagement cyclable l'emporte sur
  # la nature de la voie qui le porte, la nature l'emporte sur le classement
  # administratif pour les voies non carrossables, le classement l'emporte sur
  # l'importance pour tout le reste.
  - first_match:

      # 1. Aménagements cyclables propres : la restriction décrit ce qu'EST la
      #    voie, pas une contrainte qui s'y ajoute (848 entités).
      - when: {nature_de_la_restriction: [Piste cyclable, Voie verte]}
        set: {highway: cycleway}

      - when: {etat_de_l_objet: En construction}
        set: {highway: construction}

      # 2. Voies non carrossables : la nature est décisive, quel que soit le reste.
      - when: {nature: Escalier}
        set: {highway: steps}

      - when: {nature: Sentier}
        set: {highway: path}

      - when: {nature: Bac ou liaison maritime}
        set: {route: ferry, motor_vehicle: yes}

      - when: {nature: Chemin}
        set: {highway: track, surface: unpaved}

      # 3. Route empierrée : carrossable et publique (13 privées sur 56 369,
      #    54 502 en accès libre) — donc `unclassified`, pas `track`, qui
      #    sous-entendrait un usage agricole ou forestier non établi par la
      #    source. Le revêtement est porté par `surface`, qui reste requalifiable.
      - when: {nature: Route empierrée}
        set: {highway: unclassified, surface: unpaved}

      # 4. Bretelles : la BD Topo ne dit pas à quelle route la bretelle se
      #    raccorde. On déduit la classe de l'importance — approximation assumée,
      #    à remplacer par une propagation depuis les tronçons connectés une fois
      #    le graphe topologique construit (phase 3).
      - when: {nature: Bretelle}
        set:
          highway:
            from: importance
            map: {1: motorway_link, 2: trunk_link, 3: primary_link, 4: secondary_link, 5: tertiary_link, 6: tertiary_link}
            default: tertiary_link

      # 5. Ronds-points : `junction=roundabout` est une forme, pas une classe.
      #    Même remarque que pour les bretelles sur la propagation.
      - when: {nature: Rond-point}
        set:
          junction: roundabout
          oneway: "yes"
          highway:
            from: importance
            map: {1: primary, 2: primary, 3: secondary, 4: tertiary, 5: unclassified, 6: unclassified}
            default: unclassified

      # 6. Classement administratif : fait autorité quand il est renseigné.
      - when: {cpx_classement_administratif: {contains: Autoroute}}
        set: {highway: motorway}

      - when:
          all_of:
            - {cpx_classement_administratif: {contains: Nationale}}
            - {nature: [Type autoroutier, Route à 2 chaussées]}
        set: {highway: trunk}

      - when: {cpx_classement_administratif: {contains: Nationale}}
        set: {highway: primary}

      - when: {cpx_classement_administratif: {contains: Départementale}}
        set:
          highway:
            from: importance
            map: {1: primary, 2: primary, 3: secondary, 4: tertiary, 5: unclassified, 6: unclassified}
            default: unclassified

      # 7. Repli nature × importance pour les 84,3 % non classés.
      #    `Type autoroutier` sans classement Autoroute : le préfixe du numéro
      #    tranche (A10 → motorway ; N147 en voie express → trunk).
      - when: {nature: Type autoroutier, cpx_numero: {matches: "^[Aa]"}}
        set: {highway: motorway}

      - when: {nature: Type autoroutier}
        set: {highway: trunk}

      - when: {nature: Route à 2 chaussées}
        set:
          highway:
            from: importance
            map: {1: trunk, 2: primary, 3: secondary, 4: tertiary, 5: unclassified, 6: unclassified}
            default: unclassified

      # Importance 5 = desserte locale : 129 135 tronçons, le gros du réseau.
      # `urbain` sépare la voirie de lotissement (residential) de la voie
      # communale rase-campagne (unclassified).
      - when: {nature: Route à 1 chaussée, importance: 5, urbain: true}
        set: {highway: residential}

      - when: {nature: Route à 1 chaussée}
        set:
          highway:
            from: importance
            map: {1: primary, 2: primary, 3: secondary, 4: tertiary, 5: unclassified, 6: service}
            default: unclassified

      - when: {}
        set: {highway: road}   # filet de sécurité : signale une nature inattendue

  # ----------------------------------------------------------------- toponymie
  # La BAN passe devant malgré sa moindre couverture (32,6 % contre 86,6 %) :
  # elle est correctement orthographiée, alors que `nom_collaboratif` est du
  # FANTOIR en majuscules abrégées — 288 984 valeurs sur 296 962 dans la Vienne.
  # Le repli est normalisé (cf. rules/abreviations_fantoir.yaml).
  - compute:
      use: nom_de_voie
      args:
        left: nom_voie_ban_gauche
        right: nom_voie_ban_droite
        fallback_left: nom_collaboratif_gauche
        fallback_right: nom_collaboratif_droite

  # ------------------------------------------------------------ numérotation
  - set:
      ref: {from: cpx_numero}
      int_ref: {from: cpx_numero_route_europeenne}
      # Valeur brute par défaut : les gestionnaires non départementaux
      # (DIR Centre Ouest, COFIROUTE, ASF…) sont déjà des noms d'exploitant.
      operator: {from: cpx_gestionnaire}

  # Pour les conseils départementaux, la BD Topo ne donne que le nom du
  # département — « Vienne » n'est pas un exploitant. La deuxième passe écrase
  # la valeur brute ; un `map` sans correspondance n'émet rien et laisse donc
  # les autres gestionnaires intacts.
  # Seuls les départements réellement présents dans l'emprise de la Vienne sont
  # listés : ajouter la France entière ici serait du remplissage non vérifié.
  - set:
      operator:
        from: cpx_gestionnaire
        map:
          Vienne: Département de la Vienne
          Haute-Vienne: Département de la Haute-Vienne
          Charente: Département de la Charente
          Indre: Département de l'Indre
          Indre-et-Loire: Département d'Indre-et-Loire
          Deux-Sèvres: Département des Deux-Sèvres
          Maine-et-Loire: Département de Maine-et-Loire
          # Tronçons limitrophes en gestion partagée : le point-virgule est la
          # convention OSM pour une clé à valeurs multiples.
          Vienne/Deux-Sèvres: Département de la Vienne;Département des Deux-Sèvres
          Charente/Vienne: Département de la Charente;Département de la Vienne

  # ---------------------------------------------------------------- circulation
  - set:
      oneway:
        from: sens_de_circulation
        map: {Sens direct: "yes", Sens inverse: "-1"}
      # La BD Topo code l'inconnu par 0 sur ces champs quantitatifs : `lanes=0`
      # et `width=0` seraient des tags absurdes, pas des mesures.
      lanes: {from: nombre_de_voies, drop_values: [0]}
      width: {from: largeur_de_chaussee, decimals: 1, drop_values: [0]}

  # Le rond-point pose déjà oneway=yes ; `sens_de_circulation` = "Sans objet"
  # sur ces tronçons ne doit pas l'effacer (le map ci-dessus n'émet rien).

  # ------------------------------------------------------- position verticale
  - set:
      bridge:
        from: position_par_rapport_au_sol
        map: {1: "yes", 2: "yes", 3: "yes", 4: "yes"}
      tunnel:
        from: position_par_rapport_au_sol
        map: {-1: "yes", -2: "yes", -3: "yes", -4: "yes"}
      layer:
        from: position_par_rapport_au_sol
        map: {-4: "-4", -3: "-3", -2: "-2", -1: "-1", 1: "1", 2: "2", 3: "3", 4: "4"}
      ford:
        from: position_par_rapport_au_sol
        map: {Gué ou radier: "yes"}

  # --------------------------------------------------------------------- accès
  - set:
      access: {from: prive, map: {1: private}}
      motor_vehicle:
        from: acces_vehicule_leger
        map:
          Physiquement impossible: "no"
          Restreint aux ayants droit: destination
      toll: {from: acces_vehicule_leger, map: {A péage: "yes"}}
      foot:
        from: acces_pieton
        map: {Libre: "yes", Restreint aux ayants droit: destination}
      hazmat: {from: matieres_dangereuses_interdites, map: {1: "no"}}

  # `reserve_aux_bus` : voie réservée aux transports en commun (0,1 %).
  - when: {reserve_aux_bus: {present: true}}
    set: {access: "no", psv: designated}

  # Voie verte : usage partagé piéton/cycle réglementé. Posé APRÈS le bloc accès,
  # qui dériverait sinon `foot=yes` depuis `acces_pieton` et perdrait le caractère
  # aménagé de la voie.
  - when: {nature_de_la_restriction: Voie verte}
    set: {foot: designated, bicycle: designated, motor_vehicle: "no"}

  # ------------------------------------------------------------- restrictions
  - set:
      maxheight: {from: restriction_de_hauteur, decimals: 1, drop_values: [0]}
      maxweight: {from: restriction_de_poids_total, decimals: 1, drop_values: [0]}
      maxaxleload: {from: restriction_de_poids_par_essieu, decimals: 1, drop_values: [0]}
      maxwidth: {from: restriction_de_largeur, decimals: 1, drop_values: [0]}
      maxlength: {from: restriction_de_longueur, decimals: 1, drop_values: [0]}

  # ------------------------------------------------- aménagements cyclables
  # Aménagements portés PAR une voie carrossable (à distinguer des pistes
  # propres traitées en tête de la classification).
  - set:
      "cycleway:left":
        from: amenagement_cyclable_gauche
        map:
          Piste cyclable: track
          Bande cyclable: lane
          Aménagement mixte hors voie verte: shared_lane
      "cycleway:right":
        from: amenagement_cyclable_droit
        map:
          Piste cyclable: track
          Bande cyclable: lane
          Aménagement mixte hors voie verte: shared_lane

  # ------------------------------------------------ conservé sous préfixe IGN
  # `vitesse_moyenne_vl` est une vitesse moyenne OBSERVÉE, pas une limitation
  # réglementaire : la sortir en `maxspeed` fabriquerait 342 000 faux tags de
  # police. L'information reste réelle et utile, donc préfixée plutôt que jetée.
  - set:
      "bdtopo:vitesse_moyenne_vl": {from: vitesse_moyenne_vl, drop_values: [0]}
      "bdtopo:fictif": {from: fictif, map: {true: "yes"}}
      "bdtopo:urbain": {from: urbain, map: {true: "yes"}}

unmapped:
  date_creation: Métadonnée de production IGN, sans équivalent OSM.
  date_modification: Idem.
  date_d_apparition: Idem — vide à 100 % sur la Vienne.
  date_de_confirmation: Idem.
  date_de_mise_en_service: Vide à 100 % sur la Vienne.
  sources: Provenance interne IGN (2,6 % rempli) ; `source` porte déjà l'attribution.
  identifiants_sources: Identifiants du producteur amont, vide à 100 %.
  methode_d_acquisition_planimetrique: Qualité de saisie, hors modèle OSM.
  precision_planimetrique: Idem.
  methode_d_acquisition_altimetrique: Idem, et l'altimétrie est écartée (Z supprimé).
  precision_altimetrique: Idem.
  itineraire_vert: Itinéraire poids lourds recommandé ; pas de tag OSM établi.
  periode_de_fermeture: Vide à 100 % sur la Vienne ; `conditional restrictions` à étudier.
  borne_debut_gauche: Référencement linéaire (PR) — relève de `point_de_repere`.
  borne_debut_droite: Idem.
  borne_fin_gauche: Idem.
  borne_fin_droite: Idem.
  insee_commune_gauche: Rattachement administratif déductible de la géométrie.
  insee_commune_droite: Idem.
  alias_gauche: Nom d'usage secondaire ; candidat `alt_name`, à arbitrer en phase 3.
  alias_droit: Idem.
  liens_vers_route_nommee: Relation vers `route_numerotee_ou_nommee` — traitée en phase 3 par une relation OSM `type=route`.
  liens_vers_itineraire_autre: Idem, vide à 100 % sur la Vienne.
  cpx_toponyme_route_nommee: Redondant avec la relation à construire en phase 3.
  cpx_toponyme_itineraire_cyclable: Vide à 100 % sur la Vienne.
  cpx_toponyme_voie_verte: Vide à 100 % sur la Vienne.
  cpx_nature_itineraire_autre: Vide à 100 % sur la Vienne.
  cpx_toponyme_itineraire_autre: Vide à 100 % sur la Vienne.
  delestage: Itinéraire de délestage, vide à 100 % sur la Vienne.
  source_voie_ban_gauche: Métadonnée de l'appariement BAN, pas la donnée elle-même.
  source_voie_ban_droite: Idem.
  lieux_dits_ban_gauche: Rattachement au lieu-dit ; relève de `zone_d_habitation`.
  lieux_dits_ban_droite: Idem.
  identifiant_voie_ban_gauche: Candidat `ref:FR:BAN` — à arbitrer en phase 3 avec l'import adresses.
  identifiant_voie_ban_droite: Idem.
  id_ban_odonyme_gauche: Idem, vide à 100 % sur la Vienne.
  id_ban_odonyme_droite: Idem.
  sens_amenagement_cyclable_gauche: Sens de l'aménagement ; nécessite `cycleway:left:oneway`, à affiner en phase 3.
  sens_amenagement_cyclable_droit: Idem.
  vitesse_collaborative: Vide à 100 % sur la Vienne.
  aire_de_retournement_dfci: Défense forêt contre l'incendie — vide à 100 % sur la Vienne.
  gabarit_dfci: Idem.
  impasse_dfci: Idem.
  nature_detaillee_dfci: Idem.
  ouvrage_d_art_limitant_dfci: Idem.
  pente_maximale_dfci: Idem.
  piste_dfci: Idem.
  piste_dfci_debroussaillee: Idem.
  piste_dfci_fosses: Idem.
  sens_de_circulation_dfci: Idem.
  tout_terrain_dfci: Idem.
  vitesse_moyenne_dfci: Idem.
  zone_de_croisement_dfci: Idem.
  categorie_dfci: Idem.
