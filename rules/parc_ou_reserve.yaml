layer: parc_ou_reserve
description: >-
  Espaces naturels protégés. 150 dans la Vienne. OSM les modélise en
  `boundary=protected_area` avec `protect_class` selon le statut juridique.

report_key: protect_class

rules:
  - set:
      source: "IGN BD TOPO® 3.5"
      "ref:FR:IGN:cleabs": "{cleabs}"
      boundary: protected_area
      name: {from: toponyme}

  - first_match:
      - when: {nature: Parc naturel régional}
        set: {protect_class: "5", leisure: nature_reserve}
      - when: {nature: Réserve naturelle, nature_detaillee: Réserve naturelle nationale}
        set: {protect_class: "1", leisure: nature_reserve}
      - when: {nature: Réserve naturelle}
        set: {protect_class: "4", leisure: nature_reserve}
      - when: {nature: Arrêté de protection}
        set: {protect_class: "4"}
      - when: {nature: Site Natura 2000, nature_detaillee: Site inscrit au titre de la Directive Habitats}
        set: {protect_class: "97", protection_title: "Natura 2000 (Habitats)"}
      - when: {nature: Site Natura 2000}
        set: {protect_class: "97", protection_title: "Natura 2000 (Oiseaux)"}
      - when: {nature: Site Ramsar}
        set: {protect_class: "98", protection_title: Ramsar}
      - when: {nature: Site acquis ou assimilé des conservatoires d'espaces naturels}
        set: {protect_class: "7", operator: "Conservatoire d'espaces naturels"}
      - when: {}
        set: {protect_class: "7"}

  - set:
      "bdtopo:nature": {from: nature}
      "bdtopo:nature_detaillee": {from: nature_detaillee}
      "bdtopo:fictif": {from: fictif, map: {true: "yes"}}

unmapped:
  etat_de_l_objet: Non discriminant sur cette couche.
